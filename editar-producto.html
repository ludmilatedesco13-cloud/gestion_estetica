<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Editar Cosmético - Gestión de Inventario</title>
<link rel="stylesheet" href="css/estilos.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body><header class="main-header"><h1>Modificar Cosmético 🌸</h1></header>
<main class="container"><section class="card form-section"><h2 id="titulo-edicion">Editar Datos del Producto</h2><form id="form-edicion">
<div class="form-group"><label for="nombre">Nombre del Producto</label><input id="nombre" required></div>
<div class="form-group-row"><div class="form-group"><label for="marca">Marca</label><input id="marca"></div><div class="form-group"><label for="origen">Origen</label><select id="origen"><option value="Coreano (K-Beauty)">Coreano (K-Beauty)</option><option value="Nacional/Otro">Nacional / Otro</option></select></div></div>
<div class="form-group-row"><div class="form-group"><label for="categoria">Categoría</label><select id="categoria" required><option value="">-- Seleccionar Categoría --</option><option>Aromaterapia</option><option>Capilar</option><option>Corporales</option><option>Cosmética Coreana</option><option>Cursos online</option><option>Faciales</option><option>Insumos</option><option>Kits</option><option>Maquillaje</option><option>Perfumes</option><option>Promociones</option><option>Suplementos</option><option>Tratamientos Profesionales</option></select></div><div class="form-group"><label for="subcategoria">Subcategoría</label><select id="subcategoria" required><option value="">-- Seleccionar Subcategoría --</option></select></div></div>
<div class="form-group"><label for="caracteristicas">Características e Información del Producto</label><textarea id="caracteristicas" rows="4" placeholder="Ej: Componentes activos, tipo de piel ideal, modo de uso..."></textarea></div>
<div class="form-group" style="margin-top:15px;"><label for="foto">Foto del Producto (Opcional)</label><div id="foto-actual" style="margin-bottom:10px;"></div><input type="file" id="foto" accept="image/jpeg,image/png,image/webp"><small style="color:#666;display:block;margin-top:4px;">Dejar vacío si no deseas cambiar la imagen actual.</small></div>
<div class="form-group-row"><div class="form-group"><label for="precio_costo">Precio Costo ($)</label><input type="text" inputmode="decimal" id="precio_costo" required></div><div class="form-group"><label for="precio_venta">Precio Venta ($)</label><input type="text" inputmode="decimal" id="precio_venta" required></div><div class="form-group"><label for="stock">Stock</label><input type="number" min="0" id="stock" required></div></div>
<button type="submit" class="btn-submit" style="margin-top:20px;">Guardar Cambios</button><a href="panel.html" style="display:block;text-align:center;margin-top:15px;color:#7d6660;font-weight:600;text-decoration:none;">Volver al Panel</a>
</form></section></main>
<script src="js/supabase-config.js"></script><script>
const categories={Aromaterapia:['Aceites esenciales','Aromatizantes de ambiente','Esencias para hornillo'],Capilar:['Capilar Productos'],Corporales:['Cremas Corporales','Geles Corporales','Manos y Pies','Tratamientos Corporales'],'Cosmética Coreana':['General K-Beauty'],'Cursos online':['General Cursos'],Faciales:['Accesorios','Ácidos','Contorno de Ojos','Cremas Humectantes y Emulsiones','Despigmentantes','Exosomas','Geles y Sueros','Labios','Limpieza y Exfoliación','Lociones y Brumas','Máscaras Faciales','Óleos y Aceites','Protección Solar','Renovadores','Sérum y Boosters'],Insumos:['Accesorios','Básicos de Gabinete','Jeringas y Agujas'],Kits:['Kits Productos'],Maquillaje:['Accesorios','Bases','Correctores','Fijadores y Polvos','Labiales y gloss','Máscaras de Pestañas','Rubores, Contornos e Iluminadores'],Perfumes:['Body splash','Femeninos'],Promociones:['General Promos'],Suplementos:['Suplementos Productos'],'Tratamientos Profesionales':['Ampollas y Concentrados','Microneedling','Radiofrecuencia']};
const parsePrice=value=>{const text=String(value||'').trim();if(text.includes(','))return Number(text.replace(/\./g,'').replace(',','.'));const parts=text.split('.');return parts.length>1&&parts.at(-1).length===3?Number(parts.join('')):Number(text)};const money=value=>Number(value||0).toLocaleString('es-AR',{maximumFractionDigits:2});const imageOf=p=>p.foto_url||p.foto||'img/producto_defecto.jpg';
document.addEventListener('DOMContentLoaded',async()=>{if((localStorage.getItem('rol')||'').toLowerCase()!=='admin')return location.href='login.html';const id=new URLSearchParams(location.search).get('id');if(!id)return location.href='panel.html';const result=await supabaseClient.from('productos').select('*').eq('id',id).single();if(result.error)return Swal.fire({icon:'error',title:'Error',text:result.error.message}).then(()=>location.href='panel.html');const p=result.data;document.getElementById('titulo-edicion').textContent=`Editar Datos de: ${p.nombre}`;['nombre','marca','caracteristicas'].forEach(k=>document.getElementById(k).value=p[k]||'');document.getElementById('origen').value=p.origen||'Nacional/Otro';document.getElementById('categoria').value=p.categoria||'';document.getElementById('subcategoria').innerHTML=(categories[p.categoria]||[]).map(v=>`<option>${v}</option>`).join('');document.getElementById('subcategoria').value=p.subcategoria||'';document.getElementById('precio_costo').value=money(p.precio_costo);document.getElementById('precio_venta').value=money(p.precio_venta);document.getElementById('stock').value=p.stock;document.getElementById('foto-actual').innerHTML=`<small style="display:block;margin-bottom:5px;color:#555;">Foto actual:</small><img src="${imageOf(p)}" alt="Foto actual" style="max-width:120px;max-height:120px;border-radius:8px;border:1px solid #ddd;object-fit:cover;">`;document.getElementById('categoria').addEventListener('change',()=>{document.getElementById('subcategoria').innerHTML=(categories[document.getElementById('categoria').value]||[]).map(v=>`<option>${v}</option>`).join('')});document.getElementById('form-edicion').addEventListener('submit',async event=>{event.preventDefault();const changes={nombre:document.getElementById('nombre').value.trim(),marca:document.getElementById('marca').value.trim(),origen:document.getElementById('origen').value,categoria:document.getElementById('categoria').value,subcategoria:document.getElementById('subcategoria').value,caracteristicas:document.getElementById('caracteristicas').value,precio_costo:parsePrice(document.getElementById('precio_costo').value),precio_venta:parsePrice(document.getElementById('precio_venta').value),stock:Number(document.getElementById('stock').value)};const update=await supabaseClient.from('productos').update(changes).eq('id',id);if(update.error)return Swal.fire({icon:'error',title:'Error',text:update.error.message});await Swal.fire({icon:'success',title:'¡Producto modificado con éxito! ✨',text:'Los cambios se guardaron correctamente.',confirmButtonColor:'#dca397'});location.href='panel.html'});});
</script></body></html>
