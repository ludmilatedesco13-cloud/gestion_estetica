<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - K-Beauty System</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>body{display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#fcf9f8}.login-card{width:100%;max-width:400px;padding:30px}</style>
</head>
<body>
<main class="card login-card">
    <h2 style="text-align:center;margin-bottom:20px;">Iniciar Sesión 🌸</h2>
    <form id="form-login">
        <div class="form-group"><label for="usuario">Usuario</label><input id="usuario" required autofocus></div>
        <div class="form-group"><label for="password">Contraseña</label><input id="password" type="password" required></div>
        <button type="submit" class="btn-submit" style="margin-top:10px;">Ingresar</button>
    </form>
</main>
<script src="js/supabase-config.js"></script>
<script>
document.getElementById('form-login').addEventListener('submit', async event => {
    event.preventDefault();
    const usuario = document.getElementById('usuario').value.trim();
    const password = document.getElementById('password').value;
    const result = await supabaseClient.from('usuarios').select('id, usuario, password, rol').eq('usuario', usuario).single();
    if (result.error || !result.data || result.data.password !== password) {
        Swal.fire({ icon: 'error', title: 'Acceso denegado', text: 'Usuario o contraseña incorrectos.', confirmButtonColor: '#dca397' });
        return;
    }
    localStorage.setItem('usuario', result.data.usuario);
    localStorage.setItem('rol', result.data.rol);
    localStorage.setItem('usuario_id', result.data.id);
    window.location.href = 'panel.html';
});
</script>
</body>
</html>
